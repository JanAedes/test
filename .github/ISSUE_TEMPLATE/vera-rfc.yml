name: Bug Report
description: Rapporteer een fout in de applicatie
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Bedankt voor het melden! Vul de onderstaande velden zo compleet mogelijk in.
  - type: input
    id: app-version
    attributes:
      label: Applicatie Versie
      placeholder: bijv. v2.1.0
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Prioriteit
      options:
        - Laag
        - Gemiddeld
        - Hoog
        - Kritiek
  - type: textarea
    id: steps
    attributes:
      label: Stappen om te reproduceren
      placeholder: Hoe kunnen we deze bug terugvinden?
    validations:
      required: true
